<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光遇 MIDI 智能转谱</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #0f172a; color: #fff; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: #3b82f6; }
        .btn-green { background: #10b981; }
        .btn-gradient { background: linear-gradient(135deg, #38bdf8, #6366f1); }
    </style>
</head>
<body>
    <h2 style="text-align:center;">🎹 光遇 MIDI 转谱</h2>
    <div class="card">
        <input type="file" id="midiFile" accept=".mid, .midi" style="color:#fff;">
        <div id="status" style="margin-top:10px; color:#38bdf8;">请选择文件</div>
    </div>
    <div class="card" id="configPanel" style="display:none;">
        <input type="text" id="songName" placeholder="歌曲名" style="width:100%; padding:10px; margin-bottom:10px; background:#0f172a; color:#fff; border:1px solid #333;">
        <input type="text" id="authorName" placeholder="作者" style="width:100%; padding:10px; margin-bottom:10px; background:#0f172a; color:#fff; border:1px solid #333;">
        <button class="btn-gradient" id="convertBtn">✨ 开始转换</button>
    </div>
    <div class="card" id="downloadArea" style="display:none;">
        <div id="actionButtonsContainer" style="display:flex; gap:10px; margin-top:10px;"></div>
    </div>

    <script type="importmap">
    { "imports": { "@tonejs/midi": "https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/+esm" } }
    </script>
    <script type="module">
        import { Midi } from '@tonejs/midi';
        
        let currentMidi = null;
        let pendingJson = "";
        
        document.getElementById('midiFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('status').innerText = "读取中...";
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentMidi = new Midi(ev.target.result);
                document.getElementById('status').innerText = "解析成功！";
                document.getElementById('configPanel').style.display = 'block';
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('convertBtn').addEventListener('click', () => {
            if (!currentMidi) return;
            document.getElementById('status').innerText = "转换中...";
            
            // 极简转谱逻辑
            let notes = [];
            currentMidi.tracks.forEach(track => {
                track.notes.forEach(note => {
                    let pitch = note.midi;
                    while (pitch < 60) pitch += 12;
                    while (pitch > 76) pitch -= 12;
                    // 简单映射到 15 键
                    const keys = {60:"1Key0",62:"1Key1",64:"1Key2",65:"1Key3",67:"1Key4",69:"1Key5",71:"1Key6",72:"1Key7",74:"1Key8",76:"1Key9"};
                    let bestKey = "1Key0", minDiff = 999;
                    for (let k in keys) {
                        let diff = Math.abs(pitch - k);
                        if (diff < minDiff) { minDiff = diff; bestKey = keys[k]; }
                    }
                    notes.push({ time: Math.round(note.time * 1000), key: bestKey });
                });
            });
            notes.sort((a,b) => a.time - b.time);

            const songData = [{
                name: document.getElementById('songName').value || "未命名",
                author: document.getElementById('authorName').value || "未知作者",
                transcribedBy: "光遇玩家",
                bpm: 120,
                songNotes: notes
            }];
            pendingJson = JSON.stringify(songData);
            
            document.getElementById('status').innerText = "转换完成！";
            document.getElementById('downloadArea').style.display = 'block';
            
            const container = document.getElementById('actionButtonsContainer');
            container.innerHTML = `
                <button id="btnSendApp" class="btn-blue" style="flex:1;">🚀 发送至 App</button>
                <button id="btnSaveLocal" class="btn-green" style="flex:1;">📁 保存至本地</button>
            `;

            document.getElementById('btnSendApp').onclick = () => {
                if (window.AndroidBridge) {
                    const payload = {
                        name: document.getElementById('songName').value,
                        author: document.getElementById('authorName').value,
                        notes: notes,
                        fullJson: pendingJson,
                        targetFolder: "AppSheets"
                    };
                    window.AndroidBridge.startPlay(JSON.stringify(payload));
                } else {
                    alert("请在 App 内使用");
                }
            };

            document.getElementById('btnSaveLocal').onclick = () => {
                if (window.AndroidBridge) {
                    const payload = {
                        name: document.getElementById('songName').value,
                        author: document.getElementById('authorName').value,
                        fullJson: pendingJson,
                        targetFolder: "LocalSheets"
                    };
                    window.AndroidBridge.saveLocal(JSON.stringify(payload));
                } else {
                    alert("请在 App 内使用");
                }
            };
        });
    </script>
</body>
</html>
