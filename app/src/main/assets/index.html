<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光遇 MIDI ✨OneStar</title>
    <style>
        :root { 
            --sky-bg: #050914; 
            /* 高性能纯色磨砂底：用较高的不透明度保证可读性，省去 GPU 模糊计算 */
            --card-bg: rgba(15, 23, 42, 0.85); 
            --card-border: rgba(56, 189, 248, 0.2);
            --card-glow: rgba(56, 189, 248, 0.1);
            
            --primary: #38bdf8; 
            --primary-glow: rgba(56, 189, 248, 0.6);
            --accent: #fde047; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --success: #10b981; 
            --danger: #ef4444; 
            
            /* 极速过渡曲线 */
            --fast-ease: cubic-bezier(0.2, 0, 0, 1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 16px; max-width: 600px; margin: 0 auto; 
            background-color: var(--sky-bg); 
            color: var(--text-main); min-height: 100vh; overflow-x: hidden;
            position: relative;
        }

        /* ==========================================
           光遇随机风景背景层
           - 纯 CSS radial-gradient 光晕，GPU 合成，无 backdrop-filter
           - 每次打开随机一套光遇配色，两套叠加 + 缓慢漂移
           - pointer-events:none 绝不挡交互
           ========================================== */
        .sky-scenery {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            transform: translateZ(0);
            background: var(--sky-bg);
            transition: opacity 0.6s var(--fast-ease);
        }
        .sky-layer {
            position: absolute;
            inset: -20%;
            will-change: transform;
            transform: translateZ(0);
        }
        .sky-layer.a {
            animation: skyDriftA 40s ease-in-out infinite alternate;
        }
        .sky-layer.b {
            animation: skyDriftB 55s ease-in-out infinite alternate;
        }
        @keyframes skyDriftA {
            0%   { transform: translate3d(-2%, -1%, 0) scale(1.02); }
            100% { transform: translate3d(3%, 2%, 0) scale(1.08); }
        }
        @keyframes skyDriftB {
            0%   { transform: translate3d(2%, 1%, 0) scale(1.05); }
            100% { transform: translate3d(-3%, -2%, 0) scale(1.0); }
        }

        /* 底部地平线微光，模拟光遇云海 */
        .sky-horizon {
            position: absolute;
            left: -10%; right: -10%; bottom: -10%;
            height: 45%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.55;
            filter: blur(18px);
            transform: translateZ(0);
        }

        .stars { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden;}
        .star { 
            position: absolute; background: #fff; border-radius: 50%; 
            box-shadow: 0 0 6px #fff; animation: twinkle 3s infinite alternate ease-in-out; 
        }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.8); } 100% { opacity: 0.8; transform: scale(1.2); } }

        .content-wrapper { position: relative; z-index: 10; }

        h1 { 
            font-size: 1.6rem; text-align: center; margin-bottom: 20px; 
            font-weight: 800; letter-spacing: 1px; 
            text-shadow: 0 0 15px var(--primary-glow); 
            animation: dropIn 0.5s var(--fast-ease) both; 
        }
        h1 span { 
            color: var(--primary); 
            background: linear-gradient(90deg, #38bdf8, #818cf8); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* 高性能“实体磨砂”卡片 */
        .glass-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 20px; 
            padding: 20px; margin-bottom: 16px; 
            /* 用内阴影模拟玻璃边缘折射，用外阴影做霓虹发光 */
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5), 
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 0 20px var(--card-glow);
            animation: slideUpFade 0.5s var(--fast-ease) both;
            transform: translateZ(0); /* 强制 GPU 渲染该层 */
        }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* 拖拽区 */
        .drop-zone { 
            border: 2px dashed rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 30px 20px; 
            text-align: center; cursor: pointer; transition: all 0.15s var(--fast-ease); 
            position: relative; background: rgba(0, 0, 0, 0.2); overflow: hidden;
        }
        .drop-zone:hover, .drop-zone.dragover { 
            border-color: var(--primary); background: rgba(56, 189, 248, 0.05); 
            box-shadow: inset 0 0 20px var(--card-glow);
        }
        .drop-zone.has-file { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }
        .drop-zone .icon { 
            font-size: 2.5rem; margin-bottom: 10px; display: block; 
            filter: drop-shadow(0 0 10px var(--primary-glow)); 
            transition: transform 0.2s var(--fast-ease); 
        }
        .drop-zone:hover .icon { transform: scale(1.1) translateY(-4px); }
        .drop-zone p { margin: 0; color: var(--text-muted); font-size: 0.95rem; font-weight: 500; transition: color 0.15s; }
        .drop-zone:hover p { color: #fff; }
        .drop-zone .filename { color: var(--success); font-weight: bold; margin-top: 8px; display: block; font-size: 0.9rem; }
        input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 10; }

        /* 标题分割线 */
        .section-title {
            display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
            font-size: 0.95rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(56,189,248,0.3), transparent); }

        /* 表单输入 */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 14px; position: relative; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-group input[type="text"], .form-group select { 
            width: 100%; padding: 12px; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            background: rgba(0, 0, 0, 0.3); 
            color: #fff; font-size: 0.9rem; 
            transition: all 0.15s var(--fast-ease); outline: none;
        }
        .form-group input[type="text"]:focus, .form-group select:focus { 
            border-color: var(--primary); 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); 
        }

        /* 原始指标 */
        .metrics-flex { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .metric-row { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0, 0, 0, 0.2); padding: 10px 14px; border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.03); 
            transition: background 0.15s;
        }
        .metric-row:hover { background: rgba(0, 0, 0, 0.3); }
        .metric-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .metric-value { font-size: 0.85rem; font-weight: 700; color: #fff; text-align: right; }

        /* 模型卡片 */
        .model-card {
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px;
            margin-bottom: 12px; cursor: pointer; 
            transition: all 0.15s var(--fast-ease);
            background: rgba(0, 0, 0, 0.2); position: relative; overflow: hidden;
        }
        .model-card:hover { background: rgba(0, 0, 0, 0.3); }
        .model-card.active {
            border-color: var(--primary); 
            background: rgba(56, 189, 248, 0.1);
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.05);
        }
        
        .model-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .model-radio { 
            width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--text-muted); 
            position: relative; transition: all 0.15s var(--fast-ease); 
        }
        .model-card.active .model-radio { border-color: var(--primary); }
        .model-card.active .model-radio::after { 
            content: ''; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            width: 10px; height: 10px; border-radius: 50%; background: var(--primary); 
        }
        
        .model-name { font-size: 0.95rem; font-weight: 800; color: #fff; }
        .model-card.active .model-name { color: var(--primary); }
        .model-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; margin-left: 28px; }
        
        /* 按钮 */
        button.primary-btn { 
            width: 100%; padding: 16px; border-radius: 14px; border: none; 
            background: linear-gradient(135deg, #0ea5e9, #6366f1); 
            color: #fff; font-size: 1rem; font-weight: 800; cursor: pointer; 
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); 
            transition: transform 0.1s var(--fast-ease);
            margin-top: 8px;
        }
        button.primary-btn:active:not(:disabled) { transform: scale(0.96); }
        button.primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #status { margin-top: 14px; font-size: 0.85rem; color: var(--accent); text-align: center; font-weight: 600; }
        
        #log { 
            background: rgba(0, 0, 0, 0.6); padding: 14px; border-radius: 12px; 
            font-family: monospace; font-size: 0.75rem; 
            max-height: 150px; overflow-y: auto; white-space: pre-wrap; color: var(--primary); 
            border: 1px solid rgba(56, 189, 248, 0.1); display: none; margin-bottom: 16px; 
        }

        /* 结果卡片 */
        #resultCard { display: none; border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(16,185,129,0.1); }
        .res-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        .res-item { background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid rgba(16, 185, 129, 0.1); }
        .res-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .res-value { font-size: 1.1rem; font-weight: 900; color: #fff; }
        
        .action-row { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
        .action-row .btn-group { display: flex; gap: 12px; }
        .action-row button { 
            flex: 1; padding: 14px; border-radius: 12px; border: none; 
            color: #fff; font-weight: 700; cursor: pointer; font-size: 0.95rem;
            transition: transform 0.1s var(--fast-ease);
        }
        .action-row button:active { transform: scale(0.95); }
        
        /* 卡片隐藏动画（切换模型时平滑淡出缩小） */
        .card-hiding {
            opacity: 0 !important;
            transform: translateY(10px) scale(0.96) !important;
            transition: opacity 0.18s var(--fast-ease), transform 0.18s var(--fast-ease) !important;
            pointer-events: none;
        }

        .toast { 
            background: rgba(15, 23, 42, 0.95); padding: 12px 24px; border-radius: 30px; 
            color: #fff; font-size: 0.9rem; font-weight: 600; position: fixed; 
            top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; 
            animation: dropDown 0.2s var(--fast-ease); border-left: 4px solid var(--primary); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        @keyframes dropDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    </style>
</head>
<body>

<!-- 光遇随机风景背景（CSS 生成，JS 注入具体配色） -->
<div class="sky-scenery" id="skyScenery">
    <div class="sky-layer a" id="skyLayerA"></div>
    <div class="sky-layer b" id="skyLayerB"></div>
    <div class="sky-horizon" id="skyHorizon"></div>
</div>

<div class="stars" id="stars"></div>

<div class="content-wrapper">
    <div id="toast-container"></div>
    <h1>光遇 MIDI <span>✨OneStar</span></h1>

    <div class="glass-card" style="padding: 12px;">
        <div class="drop-zone" id="dropZone">
            <span class="icon">🎵</span>
            <p id="dropText">点击选择或拖拽 MIDI 文件</p>
            <input type="file" id="midiFile" accept=".mid, .midi">
        </div>
    </div>

    <div class="glass-card" id="configPanel" style="display: none;">
        
        <div class="section-title">📊 原始指标</div>
        <div class="metrics-flex">
            <div class="metric-row"><span class="metric-label">包含轨道 / 有效</span><span class="metric-value"><span id="infoTotalTracks">-</span> / <span id="infoValidTracks">-</span></span></div>
            <div class="metric-row"><span class="metric-label">包含乐器</span><span class="metric-value" id="infoInstruments" style="font-size: 0.8rem;">-</span></div>
            <div class="metric-row"><span class="metric-label">原曲 BPM</span><span class="metric-value" id="infoBpm">-</span></div>
            <div class="metric-row"><span class="metric-label">原曲时长</span><span class="metric-value" id="infoDuration">-</span></div>
            <div class="metric-row"><span class="metric-label">音高范围</span><span class="metric-value" id="infoPitchRange">-</span></div>
            <div class="metric-row"><span class="metric-label">总音符量</span><span class="metric-value" id="infoTotalNotes">-</span></div>
        </div>

        <div class="section-title" style="margin-top: 20px;">⚙️ 转换配置</div>
        
        <div class="form-group">
            <label>提取目标音轨</label>
            <select id="trackSelect"></select>
        </div>

        <div class="grid-2">
            <div class="form-group"><label>歌曲名称</label><input type="text" id="songNameInput" placeholder="未命名"></div>
            <div class="form-group"><label>原曲作者</label><input type="text" id="authorInput" placeholder="未知作者"></div>
        </div>
        <div class="form-group">
            <label>改编者 / 谱师</label>
            <input type="text" id="transcriberInput" placeholder="填你自己" value="_OneStar">
        </div>

        <div class="section-title" style="margin-top: 20px;">🧠 核心提取模型</div>
        
        <div class="model-card active" data-mode="melody">
            <div class="model-header">
                <div class="model-radio"></div>
                <div class="model-name">Sky-Ultra-Melody</div>
            </div>
            <div class="model-desc">针对旋律主导的歌曲，AI 自动优化并剔除长音，精准锁定最高音主线，适合手动弹奏。</div>
        </div>

        <div class="model-card" data-mode="full">
            <div class="model-header">
                <div class="model-radio"></div>
                <div class="model-name">Sky-Pro-Ensemble</div>
            </div>
            <div class="model-desc">更倾向于全曲还原，支持智能和弦拆分与琶音化处理，保留丰富的伴奏细节，适合追求极致听感。</div>
        </div>

        <button id="convertBtn" class="primary-btn">✨ 启动 AI 深度提取</button>
        <div id="status">准备就绪</div>
    </div>

    <div id="log"></div>

    <div class="glass-card" id="resultCard">
        <div class="section-title" style="color: var(--success);">✅ 提取完成</div>
        
        <div class="res-metrics">
            <div class="res-item"><div class="res-label">输出音符数</div><div class="res-value" id="stepFinalNotes" style="color: var(--success);">-</div></div>
            <div class="res-item"><div class="res-label">时间跨度</div><div class="res-value" id="outDuration">-</div></div>
            <div class="res-item"><div class="res-label">Studio 速度</div><div class="res-value" id="outSpeed" style="color: var(--primary);">-</div></div>
            <div class="res-item"><div class="res-label">音域平移</div><div class="res-value" id="outShift" style="color: var(--accent);">-</div></div>
        </div>
        
        <div class="action-row" id="actionRow">
            <div class="btn-group" id="appActions">
                <button id="btnSendApp" style="background: linear-gradient(135deg, #0ea5e9, #6366f1);">🚀 发送至 App</button>
                <button id="btnSaveLocal" style="background: linear-gradient(135deg, #10b981, #059669);">📁 保存至本地</button>
            </div>
            <div id="browserActions" style="display: none;">
                <button id="btnDownload" style="background: linear-gradient(135deg, #f59e0b, #ea580c); width: 100%;">⬇️ 浏览器直接下载 .txt</button>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
{
  "imports": {
    "@tonejs/midi": "https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/+esm"
  }
}
</script>

<script type="module">
import { Midi } from '@tonejs/midi';

/* ==========================================
   光遇随机风景背景生成
   - 多组光遇标志性配色，每次打开随机一套
   - 纯 radial-gradient 光晕叠加，GPU 合成
   - 无 backdrop-filter、无网络请求、零卡顿
   ========================================== */
const SKY_SCENES = [
    { // 晨岛·蓝绿晨光
        a: 'radial-gradient(circle at 25% 20%, rgba(56,189,248,0.35), transparent 55%), radial-gradient(circle at 78% 30%, rgba(129,140,248,0.25), transparent 50%)',
        b: 'radial-gradient(circle at 60% 75%, rgba(16,185,129,0.22), transparent 55%), radial-gradient(circle at 20% 85%, rgba(56,189,248,0.18), transparent 50%)',
        horizon: 'linear-gradient(to top, rgba(56,189,248,0.35), rgba(16,185,129,0.08), transparent)'
    },
    { // 霞谷·暖橙黄昏
        a: 'radial-gradient(circle at 30% 25%, rgba(251,146,60,0.35), transparent 55%), radial-gradient(circle at 75% 35%, rgba(244,114,182,0.25), transparent 50%)',
        b: 'radial-gradient(circle at 55% 78%, rgba(253,224,71,0.20), transparent 55%), radial-gradient(circle at 18% 80%, rgba(239,68,68,0.15), transparent 50%)',
        horizon: 'linear-gradient(to top, rgba(251,146,60,0.40), rgba(244,114,182,0.10), transparent)'
    },
    { // 云野·青粉晨雾
        a: 'radial-gradient(circle at 22% 30%, rgba(129,140,248,0.32), transparent 55%), radial-gradient(circle at 80% 22%, rgba(244,114,182,0.22), transparent 50%)',
        b: 'radial-gradient(circle at 62% 72%, rgba(56,189,248,0.22), transparent 55%), radial-gradient(circle at 25% 85%, rgba(165,180,252,0.18), transparent 50%)',
        horizon: 'linear-gradient(to top, rgba(129,140,248,0.35), rgba(244,114,182,0.08), transparent)'
    },
    { // 雨林·幽绿湿光
        a: 'radial-gradient(circle at 28% 22%, rgba(16,185,129,0.32), transparent 55%), radial-gradient(circle at 76% 30%, rgba(56,189,248,0.22), transparent 50%)',
        b: 'radial-gradient(circle at 58% 78%, rgba(20,184,166,0.24), transparent 55%), radial-gradient(circle at 20% 82%, rgba(34,197,94,0.16), transparent 50%)',
        horizon: 'linear-gradient(to top, rgba(16,185,129,0.35), rgba(20,184,166,0.08), transparent)'
    },
    { // 禁阁·深紫夜光
        a: 'radial-gradient(circle at 26% 24%, rgba(139,92,246,0.32), transparent 55%), radial-gradient(circle at 78% 32%, rgba(56,189,248,0.22), transparent 50%)',
        b: 'radial-gradient(circle at 60% 76%, rgba(99,102,241,0.24), transparent 55%), radial-gradient(circle at 22% 84%, rgba(192,132,252,0.16), transparent 50%)',
        horizon: 'linear-gradient(to top, rgba(139,92,246,0.38), rgba(56,189,248,0.08), transparent)'
    },
    { // 伊甸·红黑余烬
        a: 'radial-gradient(circle at 30% 26%, rgba(239,68,68,0.30), transparent 55%), radial-gradient(circle at 74% 34%, rgba(251,146,60,0.22), transparent 50%)',
        b: 'radial-gradient(circle at 56% 78%, rgba(190,24,93,0.22), transparent 55%), radial-gradient(circle at 20% 82%, rgba(239,68,68,0.14), transparent 50%)',
        horizon: 'linear-gradient(to top, rgba(239,68,68,0.35), rgba(251,146,60,0.08), transparent)'
    }
];

(function applyRandomSkyScene() {
    const scene = SKY_SCENES[Math.floor(Math.random() * SKY_SCENES.length)];
    const layerA = document.getElementById('skyLayerA');
    const layerB = document.getElementById('skyLayerB');
    const horizon = document.getElementById('skyHorizon');
    if (layerA) layerA.style.background = scene.a;
    if (layerB) layerB.style.background = scene.b;
    if (horizon) horizon.style.background = scene.horizon;
})();

/* ==========================================
   极简星空粒子层（40 颗，随机分布 + 闪烁）
   ========================================== */
const starContainer = document.getElementById('stars');
for (let i = 0; i < 40; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = (Math.random() * 2 + 1) + 'px';
    star.style.height = (Math.random() * 2 + 1) + 'px';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDelay = (Math.random() * 3) + 's';
    starContainer.appendChild(star);
}

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

const midiInput = document.getElementById('midiFile');
const dropZone = document.getElementById('dropZone');
const dropText = document.getElementById('dropText');
const configPanel = document.getElementById('configPanel');
const trackSelect = document.getElementById('trackSelect');
const songNameInput = document.getElementById('songNameInput');
const authorInput = document.getElementById('authorInput');
const transcriberInput = document.getElementById('transcriberInput');
const convertBtn = document.getElementById('convertBtn');
const statusDiv = document.getElementById('status');
const logDiv = document.getElementById('log');
const resultCard = document.getElementById('resultCard');

let currentMidiData = null;
let pendingTxtContent = null;
let selectedMode = 'melody';

/* 切换模型：结果卡片与日志平滑淡出缩小后隐藏 */
document.querySelectorAll('.model-card').forEach(card => {
    card.addEventListener('click', () => {
        if(card.classList.contains('active')) return;
        
        document.querySelectorAll('.model-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedMode = card.getAttribute('data-mode');
        
        if (resultCard.style.display !== 'none') {
            resultCard.classList.add('card-hiding');
            logDiv.classList.add('card-hiding');
            setTimeout(() => {
                resultCard.style.display = 'none';
                logDiv.style.display = 'none';
                resultCard.classList.remove('card-hiding');
                logDiv.classList.remove('card-hiding');
            }, 180);
        } else {
            resultCard.style.display = 'none';
            logDiv.style.display = 'none';
        }
        setStatus('准备就绪');
    });
});

function log(msg) { logDiv.textContent += msg + '\n'; logDiv.scrollTop = logDiv.scrollHeight; }
function setStatus(msg) { statusDiv.textContent = msg; }

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false));
['dragenter', 'dragover'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false));
['dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false));
dropZone.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) { midiInput.files = e.dataTransfer.files; handleFileSelect(); } });

const KEY_MAP = { 60: "1Key0", 62: "1Key1", 64: "1Key2", 65: "1Key3", 67: "1Key4", 69: "1Key5", 71: "1Key6", 72: "1Key7", 74: "1Key8", 76: "1Key9" };
const VALID_KEYS = [60,62,64,65,67,69,71,72,74,76];

function calculateBestShift(notes) {
    if (notes.length === 0) return 0;
    const pitches = notes.map(n => n.midi).sort((a, b) => a - b);
    const medianPitch = pitches[Math.floor(pitches.length / 2)];
    return Math.round((68 - medianPitch) / 12) * 12;
}

function mapPitchToSky(midiPitch, shift = 0) {
    let p = midiPitch + shift;
    while (p < 60) p += 12;
    while (p > 76) p -= 12;
    let best = 60, minDist = 999;
    for (const key of VALID_KEYS) {
        const d = Math.abs(p - key);
        if (d < minDist) { minDist = d; best = key; }
    }
    return KEY_MAP[best];
}

midiInput.addEventListener('change', handleFileSelect);

function handleFileSelect() {
    const file = midiInput.files[0];
    if (!file) return;
    if (!file.name.match(/\.(mid|midi)$/i)) { showToast('请选择 MIDI 文件', 'error'); return; }

    dropZone.classList.add('has-file');
    dropText.innerHTML = `✅ 已选择：<br><span class="filename">${file.name}</span>`;
    
    let rawName = file.name.replace(/\.[^.]+$/, '');
    let songTitle = rawName, originalAuthor = '';
    const separators = [' - ', ' -', '- ', '-', '_', '—'];
    for (let sep of separators) {
        if (rawName.includes(sep)) {
            const parts = rawName.split(sep);
            if (parts.length >= 2) { songTitle = parts[0].trim(); originalAuthor = parts.slice(1).join(' ').trim(); break; }
        }
    }
    songNameInput.value = songTitle;
    authorInput.value = originalAuthor; 

    setStatus('正在读取文件...');
    showToast('读取中...', 'info');
    configPanel.style.display = 'none';
    resultCard.style.display = 'none';
    logDiv.style.display = 'none';
    logDiv.textContent = '';

    const reader = new FileReader();
    reader.onload = function(event) {
        try {
            const arrayBuffer = event.target.result;
            if (arrayBuffer.byteLength === 0) throw new Error('文件为空');

            currentMidiData = new Midi(arrayBuffer);
            
            trackSelect.innerHTML = '<option value="all">🌟 全部音轨合并</option>';
            let hasValidTrack = false;
            let instrumentsSet = new Set();
            let totalNotes = 0;
            let minMidi = 127, maxMidi = 0;
            let maxTime = 0;

            currentMidiData.tracks.forEach((track, index) => {
                if (track.notes.length > 0) {
                    hasValidTrack = true;
                    totalNotes += track.notes.length;
                    const instName = track.instrument.name || '未知乐器';
                    instrumentsSet.add(instName);
                    
                    let displayName = track.name && track.name.trim() !== "" ? track.name.trim() : `轨道 ${index + 1}`;

                    track.notes.forEach(n => {
                        if (n.midi < minMidi) minMidi = n.midi;
                        if (n.midi > maxMidi) maxMidi = n.midi;
                        if (n.time > maxTime) maxTime = n.time;
                    });

                    const option = document.createElement('option');
                    option.value = index;
                    option.text = `${displayName} (${track.notes.length}音符) - ${instName}`;
                    trackSelect.appendChild(option);
                }
            });

            if (!hasValidTrack) throw new Error('无有效音符');

            const totalSeconds = Math.floor(maxTime);
            const mins = Math.floor(totalSeconds / 60), secs = totalSeconds % 60;
            let bpmVal = currentMidiData.header.tempos.length > 0 ? Math.round(currentMidiData.header.tempos[0].bpm) : 120;

            document.getElementById('infoTotalTracks').textContent = currentMidiData.tracks.length;
            document.getElementById('infoValidTracks').textContent = currentMidiData.tracks.filter(t=>t.notes.length>0).length;
            document.getElementById('infoInstruments').textContent = Array.from(instrumentsSet).join(', ') || '无';
            document.getElementById('infoBpm').textContent = bpmVal;
            document.getElementById('infoDuration').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('infoPitchRange').textContent = `${minMidi} ~ ${maxMidi}`;
            document.getElementById('infoTotalNotes').textContent = totalNotes;

            configPanel.style.display = 'block';
            convertBtn.disabled = false; 
            setStatus('准备就绪');
            showToast('解析成功', 'success');
            
        } catch (err) {
            console.error(err);
            setStatus('❌ 解析失败');
            showToast('解析失败: ' + err.message, 'error');
            convertBtn.disabled = true;
            dropZone.classList.remove('has-file'); 
            dropText.textContent = "点击选择或拖拽 MIDI 文件";
        }
    };
    reader.onerror = function() {
        setStatus('❌ 读取失败');
        showToast('读取失败', 'error');
    };
    reader.readAsArrayBuffer(file);
}

convertBtn.addEventListener('click', () => {
    if (!currentMidiData) return;
    
    convertBtn.disabled = true; convertBtn.textContent = 'AI 正在提取中...';
    resultCard.style.display = 'none';
    logDiv.style.display = 'block'; logDiv.textContent = '';
    setStatus(selectedMode === 'melody' ? '正在提取主旋律...' : '正在极致还原...');

    setTimeout(() => {
        try {
            const selectedValue = trackSelect.value;
            let rawNotes = [];
            let extractedCount = 0;
            let longNoteCount = 0;

            let tracksToProcess = selectedValue === "all" 
                ? currentMidiData.tracks.filter((t, i) => i !== 9 && t.notes.length > 0) 
                : [currentMidiData.tracks[parseInt(selectedValue)]];

            tracksToProcess.forEach(track => {
                track.notes.forEach(note => {
                    extractedCount++;
                    if (note.duration * 1000 > 1000) {
                        longNoteCount++;
                        return;
                    }
                    rawNotes.push({ time: Math.round(note.time * 1000), midi: note.midi, velocity: note.velocity });
                });
            });

            if (rawNotes.length === 0) throw new Error('无有效音符');

            rawNotes.sort((a, b) => a.time - b.time);
            const shift = calculateBestShift(rawNotes);
            
            let mappedNotes = rawNotes.map(n => ({
                time: n.time, key: mapPitchToSky(n.midi, shift), velocity: n.velocity, origMidi: n.midi
            }));

            log(`[1] 原始识别: ${extractedCount} 个`);
            log(`[2] 剔除长音: -${longNoteCount} 个`);

            let processedNotes = [];

            if (selectedMode === 'melody') {
                log(`[3] 执行主旋律提取...`);
                const WINDOW_MS = 35;
                let windowStart = -1;

                for (let i = 0; i < mappedNotes.length; i++) {
                    let current = mappedNotes[i];
                    if (windowStart === -1) {
                        windowStart = current.time;
                        processedNotes.push(current);
                    } else if (current.time - windowStart < WINDOW_MS) {
                        let last = processedNotes[processedNotes.length - 1];
                        if (current.origMidi > last.origMidi) processedNotes[processedNotes.length - 1] = current;
                    } else {
                        windowStart = current.time;
                        processedNotes.push(current);
                    }
                }
            } else {
                log(`[3] 执行智能和弦还原...`);
                const GRID_STEP = 20, MIN_GAP = 35, MAX_CHORD_KEYS = 4, ARPEGGIO_OFFSET = 25;
                let quantized = mappedNotes.map(n => ({ ...n, time: Math.round(n.time / GRID_STEP) * GRID_STEP }));
                let grouped = [];
                quantized.forEach(note => {
                    let existing = grouped.find(g => g.time === note.time);
                    if (existing) existing.notes.push(note); else grouped.push({ time: note.time, notes: [note] });
                });
                grouped.forEach(g => {
                    g.notes.sort((a, b) => (b.velocity * 100 + b.origMidi) - (a.velocity * 100 + a.origMidi));
                    g.melody = g.notes[0];
                    g.accompaniment = g.notes.slice(1);
                });
                let deduplicated = [];
                grouped.forEach(g => {
                    let prev = deduplicated[deduplicated.length - 1];
                    if (prev && g.time - prev.time < 50) {
                        if (g.melody.key === prev.melody.key) {
                            g.accompaniment.forEach(acc => {
                                if (!prev.accompaniment.find(a => a.key === acc.key)) prev.accompaniment.push(acc);
                            });
                            return;
                        }
                    }
                    deduplicated.push(g);
                });
                let arpeggioPool = [];
                deduplicated.forEach(group => {
                    let chordKeys = [group.melody, ...group.accompaniment];
                    let uniqueKeys = [];
                    chordKeys.forEach(k => { if (!uniqueKeys.find(u => u.key === k.key)) uniqueKeys.push(k); });
                    if (uniqueKeys.length > MAX_CHORD_KEYS) {
                        let extraKeys = uniqueKeys.splice(MAX_CHORD_KEYS);
                        arpeggioPool.push({ time: group.time + ARPEGGIO_OFFSET, keys: extraKeys });
                    }
                    group.finalKeys = uniqueKeys;
                });
                arpeggioPool.forEach(arp => {
                    let existing = deduplicated.find(g => g.time === arp.time);
                    if (existing) {
                        arp.keys.forEach(k => { if(!existing.finalKeys.find(u=>u.key===k.key) && existing.finalKeys.length < MAX_CHORD_KEYS) existing.finalKeys.push(k); });
                    } else deduplicated.push({ time: arp.time, finalKeys: arp.keys, melody: null, accompaniment: [] });
                });
                deduplicated.sort((a, b) => a.time - b.time);
                let alignedGroups = [];
                let lastTime = -9999;
                deduplicated.forEach(group => {
                    if (group.time - lastTime < MIN_GAP) {
                        let prev = alignedGroups[alignedGroups.length - 1];
                        group.finalKeys.forEach(k => { if (!prev.finalKeys.find(pk => pk.key === k.key) && prev.finalKeys.length < MAX_CHORD_KEYS) prev.finalKeys.push(k); });
                    } else {
                        alignedGroups.push(group);
                        lastTime = group.time;
                    }
                });
                alignedGroups.forEach(group => {
                    group.finalKeys.forEach(k => processedNotes.push({ time: group.time, key: k.key }));
                });
            }

            let finalNotes = [];
            let lastT = -9999;
            processedNotes.forEach(n => {
                if (n.time - lastT < 15) {
                     let prev = finalNotes[finalNotes.length - 1];
                     if (prev && !prev.keys.includes(n.key)) prev.keys.push(n.key);
                } else {
                     finalNotes.push({ time: n.time, keys: [n.key] });
                     lastT = n.time;
                }
            });

            let allNotes = [];
            finalNotes.forEach(g => g.keys.forEach(k => allNotes.push({ time: g.time, key: k })));

            log(`✅ 最终输出音符: ${allNotes.length} 个\n`);

            let originalBpm = currentMidiData.header.tempos.length > 0 ? currentMidiData.header.tempos[0].bpm : 120;
            let studioSpeed = Math.round(originalBpm * (700 / 120));
            if (studioSpeed < 100) studioSpeed = 100;
            if (studioSpeed > 4000) studioSpeed = 4000;

            const finalSongName = songNameInput.value.trim() || '未命名曲目';
            const finalOriginalAuthor = authorInput.value.trim() || '未知作者';
            const finalTranscriber = transcriberInput.value.trim() || '_OneStar';

            const skyStudioData = [{
                name: finalSongName,
                author: finalOriginalAuthor,        
                transcribedBy: finalTranscriber,    
                isComposed: false,
                bpm: studioSpeed,
                bitsPerPage: 16,
                pitchLevel: 0,
                isEncrypted: false,
                songNotes: allNotes
            }];

            pendingTxtContent = JSON.stringify(skyStudioData);

            const firstNoteTime = allNotes[0].time;
            const lastNoteTime = allNotes[allNotes.length - 1].time;
            const totalDurationSec = ((lastNoteTime - firstNoteTime) / 1000).toFixed(1);

            document.getElementById('stepFinalNotes').textContent = allNotes.length;
            document.getElementById('outDuration').textContent = `${totalDurationSec}s`;
            document.getElementById('outSpeed').textContent = studioSpeed;
            document.getElementById('outShift').textContent = (shift > 0 ? '+' : '') + shift;
            
            resultCard.style.display = 'block';
            setStatus('✅ 提取完成！');
            showToast('提取完成', 'success');
            
            setTimeout(() => resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);

            // ==========================================
            // 环境检查与按钮渲染逻辑
            // ==========================================
            const isApp = typeof window.AndroidBridge !== 'undefined';
            const appActions = document.getElementById('appActions');
            const browserActions = document.getElementById('browserActions');

            if (isApp) {
                appActions.style.display = 'flex';
                browserActions.style.display = 'none';

                document.getElementById('btnSendApp').onclick = () => {
                    const rawNotesOnly = allNotes.map(n => ({ time: n.time, key: n.key }));
                    const payload = {
                        name: songNameInput.value.trim() || "未命名",
                        author: authorInput.value.trim() || "未知作者",
                        transcriber: transcriberInput.value.trim() || "_OneStar",
                        notes: rawNotesOnly,
                        fullJson: pendingTxtContent,
                        targetFolder: "AppSheets"
                    };
                    window.AndroidBridge.startPlay(JSON.stringify(payload));
                };

                document.getElementById('btnSaveLocal').onclick = () => {
                    const payload = {
                        name: songNameInput.value.trim() || "未命名",
                        author: authorInput.value.trim() || "未知作者",
                        fullJson: pendingTxtContent,
                        targetFolder: "LocalSheets"
                    };
                    window.AndroidBridge.saveLocal(JSON.stringify(payload));
                };
            } else {
                appActions.style.display = 'none';
                browserActions.style.display = 'block';

                document.getElementById('btnDownload').onclick = () => {
                    const blob = new Blob([pendingTxtContent], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${finalSongName} - ${finalOriginalAuthor}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('已触发浏览器下载', 'success');
                };
            }

        } catch (err) {
            setStatus('❌ 转换出错');
            log('错误: ' + err.message);
            showToast(err.message, 'error');
        } finally {
            convertBtn.disabled = false;
            convertBtn.textContent = '✨ 启动 AI 深度提取';
        }
    }, 50);
});
</script>
