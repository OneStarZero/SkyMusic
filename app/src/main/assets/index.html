<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光遇 MIDI 智能转谱</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --primary: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%); color: var(--text-main); min-height: 100vh; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 24px; font-weight: 700; }
        h1 span { color: var(--primary); }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 30px 20px; text-align: center; position: relative; background: rgba(15, 23, 42, 0.5); cursor: pointer; }
        .drop-zone:hover { border-color: var(--primary); }
        .drop-zone.has-file { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .drop-zone .icon { font-size: 2rem; margin-bottom: 10px; display: block; }
        .drop-zone p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
        .drop-zone .filename { color: var(--success); font-weight: bold; margin-top: 5px; display: block; }
        input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.8); color: var(--text-main); font-size: 1rem; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--primary), #6366f1); color: #fff; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { margin-top: 12px; font-size: 0.9rem; color: var(--primary); text-align: center; font-weight: 500; }
        .info-panel { display: none; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .info-panel-title { font-size: 0.95rem; font-weight: bold; color: var(--primary); margin-bottom: 12px; border-left: 4px solid var(--primary); padding-left: 10px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table td { padding: 8px 0; border-bottom: 1px dashed var(--border); }
        .data-table td:first-child { color: var(--text-muted); width: 45%; }
        .data-table td:last-child { text-align: right; font-weight: 600; color: var(--text-main); }
        .highlight-green { color: var(--success) !important; }
        #log { background: rgba(15, 23, 42, 0.95); padding: 14px; border-radius: 10px; font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; color: #a78bfa; display: none; margin-bottom: 20px; }
        #downloadArea { display: none; text-align: center; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--card-bg); padding: 12px 20px; border-radius: 8px; border-left: 4px solid var(--primary); color: #fff; font-size: 0.9rem; animation: slideInRight 0.3s ease-out forwards; transform: translateX(120%); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideInRight { to { transform: translateX(0); } }
    </style>
</head>
<body>

<div id="toast-container"></div>
<h1>🎹 光遇 MIDI <span>极速版</span></h1>

<div class="card" style="padding: 15px;">
    <div class="drop-zone" id="dropZone">
        <span class="icon">🎵</span>
        <p id="dropText">点击选择或拖拽 MIDI 文件</p>
        <input type="file" id="midiFile" accept=".mid, .midi">
    </div>
</div>

<div class="info-panel" id="rawInfoPanel">
    <div class="info-panel-title">📁 原始 MIDI 指标</div>
    <table class="data-table">
        <tr><td>总轨道数</td><td id="infoTotalTracks">-</td></tr>
        <tr><td>包含乐器</td><td id="infoInstruments" style="font-size: 0.75rem;">-</td></tr>
        <tr><td>原曲 BPM</td><td id="infoBpm">-</td></tr>
        <tr><td>总时长</td><td id="infoDuration">-</td></tr>
        <tr><td>总音符量</td><td id="infoTotalNotes">-</td></tr>
    </table>
</div>

<div class="card" id="configPanel" style="display: none;">
    <div class="form-group"><label>歌曲名称</label><input type="text" id="songNameInput"></div>
    <div class="form-group"><label>原曲作者</label><input type="text" id="authorInput"></div>
    <div class="form-group"><label>谱师</label><input type="text" id="transcriberInput" value="光遇玩家"></div>
    <button id="convertBtn">✨ 开始极速提取</button>
    <div id="status">准备就绪</div>
</div>

<div id="log"></div>

<div class="card" id="downloadArea">
    <div class="info-panel" style="display: block; margin-bottom: 20px;">
        <div class="info-panel-title">⚙️ 最终输出参数</div>
        <table class="data-table">
            <tr><td>最终输出音符数</td><td id="stepFinalNotes" class="highlight-green">-</td></tr>
            <tr><td>时间跨度</td><td id="outDuration">-</td></tr>
            <tr><td>Studio 速度</td><td id="outSpeed">-</td></tr>
            <tr><td>数据体积</td><td id="outDataSize">-</td></tr>
        </table>
    </div>
    <div id="actionButtonsContainer" style="display: flex; gap: 10px;"></div>
</div>

<!-- ⚡ 终极内置解析器 (无需本地文件/网络) -->
<script>
    // 这是一个极致精简的 MIDI 解析引擎，直接内联在 HTML 中
    function parseMidi(arrayBuffer) {
        const data = new DataView(arrayBuffer);
        let offset = 0;
        function readStr(len) { let s = ""; for (let i = 0; i < len; i++) s += String.fromCharCode(data.getUint8(offset++)); return s; }
        function readUint32() { const v = data.getUint32(offset); offset += 4; return v; }
        function readUint16() { const v = data.getUint16(offset); offset += 2; return v; }
        function readVarLen() { let v = 0, b; do { b = data.getUint8(offset++); v = (v << 7) | (b & 0x7F); } while (b & 0x80); return v; }
        function skip(n) { offset += n; }

        if (readStr(4) !== "MThd") throw new Error("非标准 MIDI 文件");
        const headerLen = readUint32();
        const format = readUint16();
        const numTracks = readUint16();
        const ticksPerBeat = readUint16();
        skip(headerLen - 6);

        let allNotes = [];
        let tempos = [];

        for (let i = 0; i < numTracks; i++) {
            if (offset >= data.byteLength) break;
            const chunkType = readStr(4);
            if (chunkType !== "MTrk") { skip(readUint32()); continue; }
            const trackLen = readUint32();
            const trackEnd = offset + trackLen;
            let currentTick = 0;
            let runningStatus = 0;

            while (offset < trackEnd) {
                const delta = readVarLen();
                currentTick += delta;
                let status = data.getUint8(offset);
                if (status < 0x80) status = runningStatus; else { offset++; runningStatus = status; }

                if (status === 0xFF) {
                    const type = data.getUint8(offset++);
                    const len = readVarLen();
                    if (type === 0x51) { // Tempo
                        const t = (data.getUint8(offset) << 16) | (data.getUint8(offset + 1) << 8) | data.getUint8(offset + 2);
                        tempos.push({ tick: currentTick, bpm: 60000000 / t });
                    }
                    skip(len);
                } else if (status === 0xF0 || status === 0xF7) {
                    skip(readVarLen());
                } else {
                    const cmd = status >> 4;
                    const channel = status & 0x0F;
                    if (cmd === 0x9) { // Note On
                        const pitch = data.getUint8(offset++);
                        const vel = data.getUint8(offset++);
                        if (vel > 0) allNotes.push({ tick: currentTick, midi: pitch, velocity: vel / 127 });
                    } else if (cmd === 0x8) { // Note Off
                        offset += 2;
                    } else if (cmd === 0xC || cmd === 0xD) { // Program Change / Channel Pressure
                        offset += 1;
                    } else { // Control Change, Pitch Bend, etc.
                        offset += 2;
                    }
                }
            }
            offset = trackEnd;
        }

        const bpm = tempos.length > 0 ? tempos[0].bpm : 120;
        const msPerTick = (60000 / bpm) / ticksPerBeat;

        return {
            tracks: [{ notes: allNotes.map(n => ({ midi: n.midi, time: n.tick * msPerTick / 1000, velocity: n.velocity, duration: 0.1 })) }],
            header: { tempos: [{ bpm: bpm }] }
        };
    }
</script>

<script>
    function showToast(msg, type = 'info') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${type}`; t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    const midiInput = document.getElementById('midiFile');
    const dropZone = document.getElementById('dropZone');
    const dropText = document.getElementById('dropText');
    const configPanel = document.getElementById('configPanel');
    const songNameInput = document.getElementById('songNameInput');
    const authorInput = document.getElementById('authorInput');
    const transcriberInput = document.getElementById('transcriberInput');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const downloadArea = document.getElementById('downloadArea');
    const actionButtonsContainer = document.getElementById('actionButtonsContainer');
    const rawInfoPanel = document.getElementById('rawInfoPanel');

    let currentMidiData = null;
    let pendingTxtContent = null;

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); }, false));
    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover'), false));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover'), false));
    dropZone.addEventListener('drop', e => { if (e.dataTransfer.files.length) { midiInput.files = e.dataTransfer.files; handleSelect(); } });

    const KEY_MAP = { 60: "1Key0", 62: "1Key1", 64: "1Key2", 65: "1Key3", 67: "1Key4", 69: "1Key5", 71: "1Key6", 72: "1Key7", 74: "1Key8", 76: "1Key9" };
    const VALID_KEYS = [60,62,64,65,67,69,71,72,74,76];

    midiInput.addEventListener('change', handleSelect);

    function handleSelect() {
        const file = midiInput.files[0];
        if (!file) return;
        
        dropZone.classList.add('has-file');
        dropText.innerHTML = `✅ 已选择：<br><span class="filename">${file.name}</span>`;
        
        let rawName = file.name.replace(/\.[^.]+$/, '');
        let title = rawName.split(/[-_]/)[0].trim();
        let author = rawName.split(/[-_]/).slice(1).join(' ').trim() || '未知作者';
        
        songNameInput.value = title;
        authorInput.value = author; 
        statusDiv.textContent = '正在解析...';

        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                // 使用内置解析器
                currentMidiData = parseMidi(ev.target.result);
                
                let totalNotes = currentMidiData.tracks[0].notes.length;
                if (totalNotes === 0) throw new Error('无音符');
                
                let maxTime = Math.max(...currentMidiData.tracks[0].notes.map(n => n.time));

                document.getElementById('infoTotalTracks').textContent = '1 轨 (已合并)';
                document.getElementById('infoInstruments').textContent = 'MIDI 乐器';
                document.getElementById('infoBpm').textContent = Math.round(currentMidiData.header.tempos[0].bpm);
                document.getElementById('infoDuration').textContent = `${Math.floor(maxTime / 60)} 分 ${Math.floor(maxTime % 60)} 秒`;
                document.getElementById('infoTotalNotes').textContent = totalNotes + ' 个';

                rawInfoPanel.style.display = 'block'; 
                configPanel.style.display = 'block';
                convertBtn.disabled = false; 
                statusDiv.textContent = '解析成功，请点击转换';
            } catch (err) {
                statusDiv.textContent = '❌ 解析失败';
                showToast(err.message, 'error');
                convertBtn.disabled = true;
            }
        };
        reader.readAsArrayBuffer(file);
    }

    convertBtn.addEventListener('click', () => {
        if (!currentMidiData) return;
        convertBtn.disabled = true; convertBtn.textContent = '提取中...';
        downloadArea.style.display = 'none'; logDiv.style.display = 'block'; logDiv.textContent = '';
        statusDiv.textContent = '正在提取主旋律...';

        setTimeout(() => {
            try {
                let rawNotes = currentMidiData.tracks[0].notes;
                let mappedNotes = rawNotes.map(n => {
                    let p = n.midi;
                    while (p < 60) p += 12; while (p > 76) p -= 12;
                    let best = 60, minDist = 999;
                    for (let key of VALID_KEYS) { let d = Math.abs(p - key); if (d < minDist) { minDist = d; best = key; } }
                    return { time: Math.round(n.time * 1000), key: KEY_MAP[best], velocity: n.velocity, origMidi: n.midi };
                }).sort((a, b) => a.time - b.time);

                const GRID_STEP = 30, MIN_GAP = 55, MAX_CHORD_KEYS = 3;
                let quantized = mappedNotes.map(n => ({ ...n, time: Math.round(n.time / GRID_STEP) * GRID_STEP }));
                let grouped = [];
                quantized.forEach(note => {
                    let ex = grouped.find(g => g.time === note.time);
                    if (ex) ex.notes.push(note); else grouped.push({ time: note.time, notes: [note] });
                });

                grouped.forEach(g => {
                    g.notes.sort((a, b) => (b.velocity * 100 + b.origMidi) - (a.velocity * 100 + a.origMidi));
                    g.melody = g.notes[0];
                    g.accompaniment = g.notes.slice(1);
                });

                let deduplicated = [];
                grouped.forEach(g => {
                    let prev = deduplicated[deduplicated.length - 1];
                    if (prev && g.time - prev.time < 85) {
                        if (g.melody.key === prev.melody.key) {
                            g.accompaniment.forEach(acc => { if (!prev.accompaniment.find(a => a.key === acc.key)) prev.accompaniment.push(acc); });
                            return;
                        }
                    }
                    deduplicated.push(g);
                });

                let arpPool = [];
                deduplicated.forEach(group => {
                    let keys = [group.melody, ...group.accompaniment];
                    let uniq = [];
                    keys.forEach(k => { if (!uniq.find(u => u.key === k.key)) uniq.push(k); });
                    if (uniq.length > MAX_CHORD_KEYS) {
                        let extra = uniq.splice(MAX_CHORD_KEYS);
                        arpPool.push({ time: group.time + 35, keys: extra });
                    }
                    group.finalKeys = uniq;
                });

                arpPool.forEach(arp => {
                    let ex = deduplicated.find(g => g.time === arp.time);
                    if (ex) arp.keys.forEach(k => { if(!ex.finalKeys.find(u=>u.key===k.key) && ex.finalKeys.length < MAX_CHORD_KEYS) ex.finalKeys.push(k); });
                    else deduplicated.push({ time: arp.time, finalKeys: arp.keys, melody: null, accompaniment: [] });
                });
                deduplicated.sort((a, b) => a.time - b.time);

                let aligned = [], lastT = -9999;
                deduplicated.forEach(group => {
                    if (group.time - lastT < MIN_GAP) {
                        let prev = aligned[aligned.length - 1];
                        group.finalKeys.forEach(k => {
                            if (!prev.finalKeys.find(pk => pk.key === k.key) && prev.finalKeys.length < MAX_CHORD_KEYS) prev.finalKeys.push(k);
                        });
                    } else {
                        aligned.push(group); lastT = group.time;
                    }
                });

                let allNotes = [];
                aligned.forEach(group => { group.finalKeys.forEach(k => { allNotes.push({ time: group.time, key: k.key }); }); });

                log(`=== 提取报告 ===\n生成成品: ${allNotes.length} 个`);

                let speed = Math.round(currentMidiData.header.tempos[0].bpm * (700 / 120));
                if (speed < 100) speed = 100; if (speed > 4000) speed = 4000;

                pendingTxtContent = JSON.stringify([{
                    name: songNameInput.value.trim() || '未命名',
                    author: authorInput.value.trim() || '未知作者',
                    transcribedBy: transcriberInput.value.trim() || '光遇玩家',
                    isComposed: false, bpm: speed, bitsPerPage: 16, pitchLevel: 0, isEncrypted: false, songNotes: allNotes
                }]);

                document.getElementById('stepFinalNotes').textContent = allNotes.length + ' 个';
                document.getElementById('outDuration').textContent = `${((allNotes[allNotes.length - 1].time - allNotes[0].time) / 1000).toFixed(1)} 秒`;
                document.getElementById('outSpeed').textContent = speed;
                document.getElementById('outDataSize').textContent = (new Blob([pendingTxtContent]).size / 1024).toFixed(1) + ' KB';
                
                statusDiv.textContent = '✅ 转换完成';
                downloadArea.style.display = 'block';
                showToast('提取完成！', 'success');

                actionButtonsContainer.innerHTML = `
                    <button id="btnSendApp" style="background: #6366f1; flex: 1;">🚀 发送至 App</button>
                    <button id="btnSaveLocal" style="background: #10b981; flex: 1;">📁 保存至本地</button>
                `;

                document.getElementById('btnSendApp').onclick = () => {
                    if (window.AndroidBridge) {
                        window.AndroidBridge.startPlay(JSON.stringify({ name: songNameInput.value.trim(), author: authorInput.value.trim(), notes: allNotes }));
                        showToast('已发送至 App', 'success');
                    }
                };

                document.getElementById('btnSaveLocal').onclick = () => {
                    if (window.AndroidBridge) {
                        window.AndroidBridge.saveLocal(JSON.stringify({ name: songNameInput.value.trim(), author: authorInput.value.trim(), fullJson: pendingTxtContent, targetFolder: "LocalSheets" }));
                        showToast('已保存至本地', 'success');
                    }
                };

            } catch (err) {
                statusDiv.textContent = '❌ 转换出错';
                showToast(err.message, 'error');
            } finally {
                convertBtn.disabled = false; convertBtn.textContent = '✨ 开始极速提取';
            }
        }, 50);
    });
</script>
</body>
</html>
