<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光遇 MIDI 智能转谱</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: var(--bg); color: var(--text); }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 5px; font-weight: 700; }
        h1 span { color: var(--primary); }
        .ai-badge { text-align: center; font-size: 0.75rem; color: #64748b; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
        .drop-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 30px 20px; text-align: center; position: relative; background: rgba(15,23,42,0.4); }
        .drop-zone.has-file { border-color: var(--success); }
        .drop-zone .icon { font-size: 2rem; display: block; margin-bottom: 10px; }
        .drop-zone p { margin: 0; color: var(--muted); font-size: 0.95rem; }
        .drop-zone .filename { color: var(--success); font-weight: bold; margin-top: 8px; display: block; font-size: 0.9rem; }
        input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); outline: none; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-panel { display: none; background: rgba(15,23,42,0.6); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table td { padding: 8px 0; border-bottom: 1px solid var(--border); }
        .data-table td:first-child { color: var(--muted); }
        .data-table td:last-child { text-align: right; font-weight: 600; }
        .highlight-green { color: var(--success) !important; }
        #log { background: #000; padding: 14px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; color: #a78bfa; display: none; margin-bottom: 20px; }
        #downloadArea { display: none; text-align: center; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--card); padding: 12px 20px; border-radius: 8px; border-left: 4px solid var(--primary); color: #fff; font-size: 0.9rem; }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: #ef4444; }
        .tips { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 30px; line-height: 1.6; }
    </style>
</head>
<body>

<div id="toast-container"></div>
<h1>🎹 光遇 MIDI <span>智能转谱</span></h1>
<div class="ai-badge">AI 辅助生成</div>

<div class="card" style="padding: 15px;">
    <div class="drop-zone" id="dropZone">
        <span class="icon">🎵</span>
        <p id="dropText">点击选择或拖拽 MIDI 文件</p>
        <input type="file" id="midiFile" accept=".mid, .midi">
    </div>
</div>

<div class="info-panel" id="rawInfoPanel">
    <div style="font-weight:bold; color:var(--primary); margin-bottom:10px;">📁 原始 MIDI 指标</div>
    <table class="data-table">
        <tr><td>总轨道数</td><td id="infoTotalTracks">-</td></tr>
        <tr><td>包含乐器</td><td id="infoInstruments" style="font-size:0.75rem;">-</td></tr>
        <tr><td>原曲 BPM</td><td id="infoBpm">-</td></tr>
        <tr><td>总时长</td><td id="infoDuration">-</td></tr>
        <tr><td>总音符量</td><td id="infoTotalNotes">-</td></tr>
    </table>
</div>

<div class="card" id="configPanel" style="display: none;">
    <div class="form-group"><label>歌曲名称</label><input type="text" id="songNameInput"></div>
    <div class="form-group"><label>原曲作者</label><input type="text" id="authorInput"></div>
    <div class="form-group"><label>谱师</label><input type="text" id="transcriberInput" value="光遇玩家"></div>
    <button id="convertBtn">✨ 开始智能提取</button>
    <div id="status" style="margin-top:10px;text-align:center;color:var(--primary);">准备就绪</div>
</div>

<div id="log"></div>

<div class="card" id="downloadArea">
    <div class="info-panel" style="display: block; margin-bottom: 20px;">
        <div style="font-weight:bold; color:var(--primary); margin-bottom:10px;">⚙️ 输出参数</div>
        <table class="data-table">
            <tr><td>最终音符数</td><td id="stepFinalNotes" class="highlight-green">-</td></tr>
            <tr><td>时间跨度</td><td id="outDuration">-</td></tr>
            <tr><td>Studio 速度</td><td id="outSpeed">-</td></tr>
            <tr><td>数据体积</td><td id="outDataSize">-</td></tr>
        </table>
    </div>
    <div id="actionButtonsContainer" style="display: flex; gap: 10px;"></div>
</div>

<div class="tips">💡 提示：发送至 App 仅在内存中预览，退出即焚。保存至本地才会永久留存。</div>

<script type="importmap">
{
  "imports": {
    "@tonejs/midi": "https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/+esm"
  }
}
</script>

<script type="module">
import { Midi } from '@tonejs/midi';

const midiInput = document.getElementById('midiFile');
const dropZone = document.getElementById('dropZone');
const dropText = document.getElementById('dropText');
const configPanel = document.getElementById('configPanel');
const songNameInput = document.getElementById('songNameInput');
const authorInput = document.getElementById('authorInput');
const transcriberInput = document.getElementById('transcriberInput');
const convertBtn = document.getElementById('convertBtn');
const statusDiv = document.getElementById('status');
const logDiv = document.getElementById('log');
const downloadArea = document.getElementById('downloadArea');
const actionButtonsContainer = document.getElementById('actionButtonsContainer');
const rawInfoPanel = document.getElementById('rawInfoPanel');

let currentMidiData = null;
let pendingTxtContent = null;

function showToast(msg, type = 'info') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`; t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
function log(msg) { logDiv.textContent += msg + '\n'; logDiv.scrollTop = logDiv.scrollHeight; }

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); }, false));
['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover'), false));
['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover'), false));
dropZone.addEventListener('drop', e => { if (e.dataTransfer.files.length) { midiInput.files = e.dataTransfer.files; handleSelect(); } });

const KEY_MAP = { 60: "1Key0", 62: "1Key1", 64: "1Key2", 65: "1Key3", 67: "1Key4", 69: "1Key5", 71: "1Key6", 72: "1Key7", 74: "1Key8", 76: "1Key9" };
const VALID_KEYS = [60,62,64,65,67,69,71,72,74,76];

midiInput.addEventListener('change', handleSelect);

function handleSelect() {
    const file = midiInput.files[0];
    if (!file) return;
    
    dropZone.classList.add('has-file');
    dropText.innerHTML = `✅ 已选择：<br><span class="filename">${file.name}</span>`;
    
    let rawName = file.name.replace(/\.[^.]+$/, '');
    let title = rawName.split(/[-_]/)[0].trim();
    let author = rawName.split(/[-_]/).slice(1).join(' ').trim() || '未知作者';
    
    songNameInput.value = title;
    authorInput.value = author; 
    statusDiv.textContent = '正在解析...';

    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            currentMidiData = new Midi(ev.target.result);
            let totalNotes = 0;
            let maxTime = 0;
            currentMidiData.tracks.forEach(t => {
                if (t.notes.length > 0) {
                    totalNotes += t.notes.length;
                    t.notes.forEach(n => { if (n.time > maxTime) maxTime = n.time; });
                }
            });
            
            document.getElementById('infoTotalTracks').textContent = currentMidiData.tracks.length + ' 轨';
            document.getElementById('infoInstruments').textContent = 'MIDI 乐器';
            document.getElementById('infoBpm').textContent = Math.round(currentMidiData.header.tempos.length > 0 ? currentMidiData.header.tempos[0].bpm : 120);
            document.getElementById('infoDuration').textContent = `${Math.floor(maxTime / 60)} 分 ${Math.floor(maxTime % 60)} 秒`;
            document.getElementById('infoTotalNotes').textContent = totalNotes + ' 个';

            rawInfoPanel.style.display = 'block'; 
            configPanel.style.display = 'block';
            convertBtn.disabled = false; 
            statusDiv.textContent = '解析成功，请点击转换';
        } catch (err) {
            statusDiv.textContent = '❌ 解析失败';
            showToast(err.message, 'error');
            convertBtn.disabled = true;
        }
    };
    reader.readAsArrayBuffer(file);
}

convertBtn.addEventListener('click', () => {
    if (!currentMidiData) return;
    convertBtn.disabled = true; convertBtn.textContent = '提取中...';
    downloadArea.style.display = 'none'; logDiv.style.display = 'block'; logDiv.textContent = '';
    statusDiv.textContent = '正在提取主旋律...';

    setTimeout(() => {
        try {
            let rawNotes = [];
            currentMidiData.tracks.forEach(track => {
                track.notes.forEach(note => {
                    if (note.duration * 1000 < 35) return; 
                    rawNotes.push({ midi: note.midi, time: note.time, velocity: note.velocity });
                });
            });

            if (rawNotes.length === 0) throw new Error('无有效音符');
            const shift = Math.round((68 - rawNotes.map(n=>n.midi).sort((a,b)=>a-b)[Math.floor(rawNotes.length/2)]) / 12) * 12;

            let mappedNotes = rawNotes.map(n => {
                let p = n.midi + shift;
                while (p < 60) p += 12; while (p > 76) p -= 12;
                let best = 60, minDist = 999;
                for (let key of VALID_KEYS) { let d = Math.abs(p - key); if (d < minDist) { minDist = d; best = key; } }
                return { time: Math.round(n.time * 1000), key: KEY_MAP[best], velocity: n.velocity, origMidi: n.midi };
            }).sort((a, b) => a.time - b.time);

            const GRID_STEP = 30, MIN_GAP = 55, MAX_CHORD_KEYS = 3;
            let quantized = mappedNotes.map(n => ({ ...n, time: Math.round(n.time / GRID_STEP) * GRID_STEP }));
            let grouped = [];
            quantized.forEach(note => {
                let ex = grouped.find(g => g.time === note.time);
                if (ex) ex.notes.push(note); else grouped.push({ time: note.time, notes: [note] });
            });

            grouped.forEach(g => {
                g.notes.sort((a, b) => (b.velocity * 100 + b.origMidi) - (a.velocity * 100 + a.origMidi));
                g.finalKeys = g.notes.slice(0, MAX_CHORD_KEYS);
            });

            let aligned = [], lastT = -9999;
            grouped.forEach(group => {
                if (group.time - lastT < MIN_GAP) {
                    let prev = aligned[aligned.length - 1];
                    group.finalKeys.forEach(k => {
                        if (!prev.finalKeys.find(pk => pk.key === k.key) && prev.finalKeys.length < MAX_CHORD_KEYS) prev.finalKeys.push(k);
                    });
                } else {
                    aligned.push(group); lastT = group.time;
                }
            });

            let allNotes = [];
            aligned.forEach(group => { group.finalKeys.forEach(k => { allNotes.push({ time: group.time, key: k.key }); }); });

            log(`=== 提取报告 ===\n生成成品: ${allNotes.length} 个`);

            let speed = Math.round((currentMidiData.header.tempos.length > 0 ? currentMidiData.header.tempos[0].bpm : 120) * (700 / 120));
            if (speed < 100) speed = 100; if (speed > 4000) speed = 4000;

            pendingTxtContent = JSON.stringify([{
                name: songNameInput.value.trim() || '未命名',
                author: authorInput.value.trim() || '未知作者',
                transcribedBy: transcriberInput.value.trim() || '光遇玩家',
                isComposed: false, bpm: speed, bitsPerPage: 16, pitchLevel: 0, isEncrypted: false, songNotes: allNotes
            }]);

            document.getElementById('stepFinalNotes').textContent = allNotes.length + ' 个';
            document.getElementById('outDuration').textContent = `${((allNotes[allNotes.length - 1].time - allNotes[0].time) / 1000).toFixed(1)} 秒`;
            document.getElementById('outSpeed').textContent = speed;
            document.getElementById('outDataSize').textContent = (new Blob([pendingTxtContent]).size / 1024).toFixed(1) + ' KB';
            
            statusDiv.textContent = '✅ 转换完成';
            downloadArea.style.display = 'block';
            showToast('提取完成！', 'success');

            actionButtonsContainer.innerHTML = `
                <button id="btnSendApp" style="background: #6366f1; flex: 1;">🚀 发送至 App</button>
                <button id="btnSaveLocal" style="background: #10b981; flex: 1;">📁 保存至本地</button>
            `;

            document.getElementById('btnSendApp').onclick = () => {
                if (window.AndroidBridge) {
                    window.AndroidBridge.startPlay(JSON.stringify({ name: songNameInput.value.trim(), author: authorInput.value.trim(), transcriber: transcriberInput.value.trim(), notes: allNotes }));
                } else {
                    showToast('请在 App 内使用', 'error');
                }
            };

            document.getElementById('btnSaveLocal').onclick = () => {
                if (window.AndroidBridge) {
                    window.AndroidBridge.saveLocal(JSON.stringify({ name: songNameInput.value.trim(), author: authorInput.value.trim(), fullJson: pendingTxtContent }));
                } else {
                    showToast('请在 App 内使用', 'error');
                }
            };

        } catch (err) {
            statusDiv.textContent = '❌ 转换出错';
            showToast(err.message, 'error');
        } finally {
            convertBtn.disabled = false; convertBtn.textContent = '✨ 开始智能提取';
        }
    }, 50);
});
</script>
</body>
</html>
