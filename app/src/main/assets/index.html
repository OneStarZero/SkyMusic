<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光遇 MIDI ✨OneStar</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* 补充 Tab 样式 */
        .tab-container { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center; border: 1px solid transparent; }
        .tab-btn.active-midi { background: rgba(56, 189, 248, 0.2); border-color: var(--primary); color: var(--primary); }
        .tab-btn.active-ocr { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; color: #a855f7; }
        .tab-btn.inactive { background: rgba(0, 0, 0, 0.3); color: var(--text-muted); }
    </style>
</head>
<body>

<div class="content-wrapper">
    <div id="toast-container"></div>
    <h1>光遇 MIDI <span>✨OneStar</span></h1>

    <!-- Tab 切换 -->
    <div class="tab-container">
        <button id="tabMidi" class="tab-btn active-midi">🎵 MIDI 转谱</button>
        <button id="tabOcr" class="tab-btn inactive">🖼️ 图片识谱</button>
    </div>

    <!-- ==================== 视图 1：MIDI 转谱 ==================== -->
    <div id="viewMidi">
        <div class="glass-card" style="padding: 12px;">
            <div class="drop-zone" id="dropZone">
                <span class="icon">🎵</span>
                <p id="dropText">点击选择或拖拽 MIDI 文件</p>
                <input type="file" id="midiFile" accept=".mid, .midi, audio/midi">
            </div>
        </div>

        <div class="glass-card" id="configPanel" style="display: none;">
            <div class="section-title">📊 原始指标</div>
            <div class="res-metrics">
                <div class="res-item"><div class="res-label">有效音轨</div><div class="res-value" id="infoTracks" style="font-size:0.9rem;">-</div></div>
                <div class="res-item"><div class="res-label">总音符量</div><div class="res-value" id="infoNotes">-</div></div>
            </div>

            <div class="section-title" style="margin-top: 20px;">⚙️ 提取目标音轨 (点击选中)</div>
            <div class="track-list custom-scrollbar" id="trackListContainer"></div>

            <div class="grid-2" style="margin-top: 16px;">
                <div class="form-group"><label>歌曲名称</label><input type="text" id="songNameInput" placeholder="未命名"></div>
                <div class="form-group"><label>原曲作者</label><input type="text" id="authorInput" placeholder="未知作者"></div>
            </div>
            <div class="form-group">
                <label>改编者 / 谱师</label>
                <input type="text" id="transcriberInput" placeholder="填你自己" value="_OneStar">
            </div>

            <div class="section-title" style="margin-top: 20px;">🧠 核心提取模型</div>
            <div class="model-card active" data-mode="fast"><div class="model-header"><div class="model-radio"></div><div class="model-name">OneStar-SkyFast</div></div><div class="model-desc">极简纯单音，剔除所有伴奏。</div></div>
            <div class="model-card" data-mode="pro"><div class="model-header"><div class="model-radio"></div><div class="model-name">OneStar-SkyPro</div></div><div class="model-desc">极致全景还原，智能和弦。</div></div>
            <div class="model-card" data-mode="fastpro"><div class="model-header"><div class="model-radio"></div><div class="model-name">OneStar-SkyFastPro</div></div><div class="model-desc">原轨直出，选多少出多少。</div></div>

            <button id="convertBtn" class="primary-btn">✨ 启动 AI 深度提取</button>
            <div id="status">准备就绪</div>
        </div>

        <div id="log" class="custom-scrollbar"></div>

        <div class="glass-card" id="resultCard">
            <div class="section-title" style="color: var(--success);">✅ 提取完成</div>
            <div class="res-metrics">
                <div class="res-item"><div class="res-label">输出音符数</div><div class="res-value" id="stepFinalNotes">-</div></div>
                <div class="res-item"><div class="res-label">时间跨度</div><div class="res-value" id="outDuration">-</div></div>
                <div class="res-item"><div class="res-label">Studio 速度</div><div class="res-value" id="outSpeed">-</div></div>
                <div class="res-item"><div class="res-label">音域平移</div><div class="res-value" id="outShift">-</div></div>
            </div>
            <div class="action-row" id="actionRow">
                <div class="btn-group" id="appActions" style="display: none;">
                    <button id="btnSendApp" style="background: linear-gradient(135deg, #0ea5e9, #6366f1);">🚀 发送至 App</button>
                    <button id="btnSaveLocal" style="background: linear-gradient(135deg, #10b981, #059669);">📁 保存至本地</button>
                </div>
                <div id="browserActions" style="display: none;">
                    <button id="btnDownload" style="background: linear-gradient(135deg, #f59e0b, #ea580c); width: 100%;">⬇️ 浏览器直接下载 .txt</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 视图 2：图片识谱 ==================== -->
    <div id="viewOcr" style="display: none;">
        <div class="glass-card" style="padding: 24px; text-align: center;">
            <span class="icon" style="font-size: 3rem; display: block; margin-bottom: 10px;">🖼️</span>
            <p style="color: var(--text-muted); margin-bottom: 20px;">上传简谱截图，AI 将自动提取并生成铺面</p>
            <button id="btnOcrPick" class="primary-btn" style="width: 100%; padding: 16px; border-radius: 12px; background: linear-gradient(135deg, #a855f7, #6366f1);">📂 选择图片</button>
            <div id="ocrStatus" style="margin-top: 16px; font-size: 0.85rem; color: var(--accent);">等待上传...</div>
        </div>

        <div class="glass-card" id="ocrResultCard" style="display: none;">
            <div class="section-title" style="color: var(--success);">✅ 识谱完成</div>
            <div class="res-metrics">
                <div class="res-item"><div class="res-label">识别音符数</div><div class="res-value" id="ocrNotesCount">-</div></div>
            </div>
            <button id="btnOcrConvert" class="primary-btn" style="margin-top: 12px; background: linear-gradient(135deg, #10b981, #059669);">✨ 发送至悬浮窗</button>
        </div>
    </div>
</div>

<script type="importmap">
{
  "imports": {
    "@tonejs/midi": "https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/+esm"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
