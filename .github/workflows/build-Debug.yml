name: Build SkyMusic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取你仓库里的所有代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 配置 Java 环境（新版安卓必须用 Java 17）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 配置 Gradle 环境（自动下载依赖）
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2

    # 4. 自动生成缺失的 gradlew 并赋予执行权限
    # （纯手机端操作很容易漏掉这个启动脚本，这一步可以帮你自动补齐）
    - name: Generate Gradle Wrapper and Fix Permissions
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    # 5. 开始编译！如果报错，下面会打印详细信息
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 6. 把编译好的 APK 上传成压缩包，供你下载
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkyMusic-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
