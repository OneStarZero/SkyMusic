name: SkyMusic Release Build

on:
  push:
    branches: [ "main", "master" ] # 只要推送到 main 或 master 就自动触发
  workflow_dispatch: # 允许你手动点击触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # ⚡ 极速构建核心：官方 Gradle 缓存机制
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false # 允许写入缓存，大幅加速二次构建

    # 解密签名文件 (使用你在 Secrets 里配置的 KEYSTORE_BASE64)
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        fi

    # 编译打包
    - name: Build Release APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease \
          --build-cache \
          --parallel \
          --configuration-cache \
          -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    # 自动重命名并输出体积（防止空文件报错）
    - name: Rename and Report APK
      run: |
        cd app/build/outputs/apk/release/
        # 如果文件存在才重命名，避免因找不到文件导致构建失败
        if [ -f "app-release.apk" ]; then
          mv app-release.apk SkyMusic-Release.apk
        elif [ -f "*.apk" ]; then
          mv $(find . -name "*.apk" | head -n 1) SkyMusic-Release.apk
        fi
        # 打印最终体积
        ls -lh SkyMusic-Release.apk

    # 上传打包好的 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyMusic-Release-Artifact
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7