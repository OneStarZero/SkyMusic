name: Build SkyMusic Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你随时手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出仓库代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 配置 Java 17 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 配置 Gradle 环境
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2

    # 4. 将 GitHub Secrets 中的 Base64 还原为真实的 .jks 文件
    # 【注意】这里直接生成在项目根目录下
    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_STRING" | base64 --decode > mykey.jks

    # 5. 生成 gradlew 并赋予执行权限（防止手机端漏传导致报错）
    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then gradle wrapper; fi
        chmod +x gradlew

    # 6. 编译正式版（Release）APK
    - name: Build Release APK
      env:
        # 对应 app/build.gradle.kts 里的环境变量读取
        KEYSTORE_PATH: "../mykey.jks"  # 相对于 app 文件夹，返回上一层找到根目录的 jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace

    # 7. 将编译好的正式版 APK 上传供你下载
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyMusic-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
