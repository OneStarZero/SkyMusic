name: SkyMusic Release Build

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 极速克隆，只拉取最新 commit

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # ⚡ 极速构建核心：官方 Gradle 缓存机制
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false # 允许写入缓存，大幅加速二次构建

    # 解密签名文件 (请在 GitHub 仓库 Settings -> Secrets 中配置)
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        fi

    - name: Build Release APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease \
          --build-cache \
          --parallel \
          --configuration-cache \
          -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    # 自动修改生成的 APK 文件名，方便直接下载
    - name: Rename APK
      run: |
        cd app/build/outputs/apk/release/
        mv *.apk SkyMusic-v0.0.6-Release.apk || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyMusic-Release-Artifact
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7 # 产物只保留7天，节省 GitHub 存储配额
