name: SkyMusic Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk'

      # 极速构建核心：官方 Gradle 缓存机制
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      # 解密签名文件
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      # 编译打包
      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --build-cache \
            --parallel \
            --configuration-cache \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 清理临时签名文件
      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release.keystore

      # 自动重命名并输出体积
      - name: Rename and Report APK
        run: |
          cd app/build/outputs/apk/release/
          if [ -f "app-release.apk" ]; then
            mv app-release.apk SkyMusic-0.1.0.apk
          elif ls *.apk >/dev/null 2>&1; then
            mv "$(ls *.apk | head -n 1)" SkyMusic-0.1.0.apk
          fi
          ls -lh SkyMusic-0.1.0.apk

      # 上传打包好的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyMusic-Release-0.1.0
          path: app/build/outputs/apk/release/SkyMusic-0.1.0.apk
          retention-days: 7
